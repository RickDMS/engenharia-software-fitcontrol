<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastrar aluno · FitControl</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="cadastro">
<div class="app">
<aside class="side"><div class="brand">FitControl</div>
<nav aria-label="Principal">
<a href="cadastrar-aluno.html" aria-current="page">Alunos</a>
<a href="registrar-pagamento.html">Pagamentos</a>
<a href="catraca.html">Catraca</a>
</nav></aside>
<main class="main">
<header class="top"><h1>Cadastrar aluno</h1><div><span class="chip role">Recepcionista</span><a class="btn sec" href="index.html" style="display:inline-flex;align-items:center;text-decoration:none">Sair</a></div></header>
<form id="form-aluno" class="card form" novalidate>
<label class="field">Nome completo<input id="nome" name="nome" type="text" placeholder="" autocomplete="off"><span class="hint"></span><span class="err" id="err-nome" role="alert"></span></label>
<div class="row"><label class="field">CPF<input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" autocomplete="off"><span class="hint">O CPF não pode estar duplicado.</span><span class="err" id="err-cpf" role="alert"></span></label><label class="field">Data de nascimento<input id="nasc" name="nasc" type="date" placeholder="" autocomplete="off"><span class="hint"></span><span class="err" id="err-nasc" role="alert"></span></label></div>
<div class="row"><label class="field">Telefone<input id="tel" name="tel" type="tel" placeholder="(00) 00000-0000" autocomplete="off"><span class="hint"></span><span class="err" id="err-tel" role="alert"></span></label><label class="field">E-mail<input id="email" name="email" type="email" placeholder="nome@email.com" autocomplete="off"><span class="hint"></span><span class="err" id="err-email" role="alert"></span></label></div>
<label class="field">Endereço<input id="end" name="end" type="text" placeholder="" autocomplete="off"><span class="hint"></span><span class="err" id="err-end" role="alert"></span></label>
<div id="cad-msg" class="msg" role="status" hidden></div>
<div class="actions"><button class="btn sec" type="reset">Cancelar</button><button class="btn" type="submit">Salvar cadastro</button></div>
</form>
<section class="card tablewrap"><table><thead><tr><th>Aluno</th><th>CPF</th><th>Situação</th></tr></thead><tbody id="lista-alunos"></tbody></table></section>
</main>
</div>
<script src="js/app.js"></script>
</body>
</html>
